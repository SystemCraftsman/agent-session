[package]
name = "agent-session"
version = "0.1.0"
edition = "2021"
rust-version = "1.80.0"
description = "Fast TUI for browsing, forking, and transferring AI coding sessions across Claude, Codex, and Cursor"
license = "MIT"
repository = "https://github.com/SystemCraftsman/agent-session"
readme = "README.md"
keywords = ["claude", "codex", "cursor", "cli", "tui"]
categories = ["command-line-utilities"]
homepage = "https://github.com/SystemCraftsman/agent-session"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-humanize = "0.2"
dirs = "6.0"
regex = "1"
syntect = "5.3"
syntect-tui = "3.0"
termbg = "0.6"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[profile.release]
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
